[package]
name = "power_control_center"
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = true
panic = 'abort'
strip = false

[profile.release]
opt-level = 3
panic = 'abort' 

[dependencies]
log = "0.4.32"
env_logger = "0.11.11"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
rust-embed = "8.13.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4.45"
reqwest = { version = "^0.13.5", default-features = false, features = ["json"] }
